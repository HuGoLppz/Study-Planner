# Servicios para desarrollar y probar la fase 4 (varias máquinas): PostgreSQL, Redis y un
# almacenamiento compatible con S3 (SeaweedFS). Solo para desarrollo: las contraseñas son de prueba
# y los puertos solo se abren en esta máquina (127.0.0.1).
#   docker compose up -d      arrancar
#   docker compose down       parar (los datos se conservan en los volúmenes)
#   docker compose down -v    parar y borrar los datos
name: study-planner

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: study_planner
      POSTGRES_PASSWORD: study_planner_dev
      POSTGRES_DB: study_planner
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U study_planner -d study_planner']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.5-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Almacenamiento de archivos compatible con S3 (credenciales en docker/seaweedfs-s3.json).
  s3:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - s3-data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres-data:
  s3-data:
